{% if site.author.xiaohongshu %}
<dialog class="wechat-dialog xiaohongshu-dialog" id="xiaohongshu-dialog" aria-labelledby="xiaohongshu-dialog-title" aria-describedby="xiaohongshu-dialog-description">
  <div class="xiaohongshu-cover" aria-hidden="true">
    <svg viewBox="32 32 1215 280" width="390" height="112" preserveAspectRatio="xMidYMid slice" focusable="false">
      <image href="{{ site.author.xiaohongshu | relative_url }}" x="0" y="0" width="1279" height="1747" />
    </svg>
    <span class="xiaohongshu-wordmark">{% include icons/xiaohongshu.svg %}</span>
  </div>
  <button class="wechat-dialog__close" type="button" aria-label="关闭小红书名片" autofocus><i class="fas fa-times" aria-hidden="true"></i></button>
  <div class="xiaohongshu-profile">
    <img class="xiaohongshu-avatar" src="{{ site.author.avatar | relative_url }}" alt="SHL 的头像" width="76" height="76" loading="lazy">
    <h2 id="xiaohongshu-dialog-title">SHL<span class="xiaohongshu-profile__badge">{% include icons/xiaohongshu.svg %}</span></h2>
    <p class="xiaohongshu-profile__name">Hongli Shen · 沈泓立</p>
    <p class="xiaohongshu-profile__id">小红书号 <span>10597577561</span></p>
    <div class="xiaohongshu-code">
      <svg class="xiaohongshu-code__image" viewBox="860 1330 320 320" width="208" height="208" role="img" aria-labelledby="xiaohongshu-code-title">
        <title id="xiaohongshu-code-title">SHL 的小红书二维码</title>
        <image href="{{ site.author.xiaohongshu | relative_url }}" x="0" y="0" width="1279" height="1747" />
      </svg>
    </div>
    <p class="xiaohongshu-profile__hint" id="xiaohongshu-dialog-description">打开小红书，扫一扫找到我</p>
    <a class="xiaohongshu-save" href="{{ site.author.xiaohongshu | relative_url }}" download="SHL-小红书名片.jpg" target="_self"><i class="fas fa-arrow-down" aria-hidden="true"></i> 保存账号名片</a>
  </div>
</dialog>
{% endif %}
